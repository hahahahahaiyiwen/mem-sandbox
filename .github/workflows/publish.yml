name: Publish to PyPI

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.route.outputs.artifact_name }}
      environment: ${{ steps.route.outputs.environment }}
      package: ${{ steps.route.outputs.package }}
      project_url: ${{ steps.route.outputs.project_url }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Select package and verify release tag
        id: route
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            mem-sandbox-v*)
              package="mem-sandbox"
              environment="pypi"
              project_url="https://pypi.org/p/mem-sandbox"
              ;;
            mem-sandbox-openai-agents-v*)
              package="mem-sandbox-openai-agents"
              environment="pypi-openai-agents"
              project_url="https://pypi.org/p/mem-sandbox-openai-agents"
              ;;
            *)
              echo "Unsupported release tag ${GITHUB_REF_NAME}." >&2
              exit 1
              ;;
          esac
          package_version="$(uv version --package "${package}" --short)"
          expected_tag="${package}-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}." >&2
            exit 1
          fi
          {
            echo "artifact_name=${package}-distributions"
            echo "environment=${environment}"
            echo "package=${package}"
            echo "project_url=${project_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release commit must be reachable from origin/main." >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build --package "${{ steps.route.outputs.package }}" --out-dir dist --no-sources

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.route.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ needs.build.outputs.project_url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          attestations: true
